openapi: 3.0.0
info:
  version: "1.0.0"
  title: "Blog Management System API"
  description: |
    This is a REST API for a blog system. Users can sign up, verify their email with a one-time
    password (OTP), and sign in. The API uses JWT access tokens. The refresh token is kept in a
    secure HttpOnly cookie. Users can sign in on many devices at once, log out from one device or
    all devices, and see their active sessions.

    There are two signed-in roles. Registered users can write, edit, and delete their own articles,
    and they can comment and reply on articles. Administrators can also manage users, categories,
    and comments. Guests can only read published articles, active categories, and public comments.

    Every article belongs to one category. Categories are never deleted. They can only be switched
    between active and unavailable. Cover images must be JPG, JPEG, PNG, or WebP files up to 5 MB.
    Comments can have replies, and deleting a comment also deletes all of its replies.

    To reset a password, the user receives an OTP by email. After the OTP is verified, the API sets
    a reset token cookie. The token is valid for 5 minutes and can be used only once. OTPs expire
    after 5 minutes and allow up to 5 attempts. Sign-up, sign-in, admin setup, and the password
    reset and OTP routes are limited to 5 requests per minute for each IP address.

    List endpoints support pagination, filtering, sorting, and search.

  contact:
    name: Md Ismile Hosen Siam
    email: ismile.20cse034@gstu.edu.bd

servers:
  - description: Local development server
    url: http://localhost:3000/api/v1

tags:
  - name: Auth
    description: Sign-up, email verification, sign-in, tokens, password reset, and sessions.
  - name: Article
    description: Articles, article status, authors, and article comments.
  - name: Category
    description: Article categories.
  - name: Comment
    description: Managing and moderating comments.
  - name: User
    description: User management, profiles, and password change.

paths:
  # ---------- Auth routes ----------
  "/auth/setup-admin":
    post:
      operationId: setupAdmin
      summary: Set up the first admin
      description: >
        Create the first administrator account and sign in with it. This works only once. After
        that, it returns 403. Limited to 5 requests per minute.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Administrator created and signed in. The refresh token is set in the refreshToken cookie.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshTokenCookie"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Administrator account created successfully.
                      data:
                        $ref: "#/components/schemas/AccessToken"
                      links:
                        $ref: "#/components/schemas/SignInLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: The administrator has already been set up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/sign-up":
    post:
      operationId: signUp
      summary: Register a user account
      description: >
        Create a new account with the status pending and send a verification OTP to the email.
        The email is saved in lowercase with extra spaces removed. If the email is already
        registered, the request is rejected. Limited to 5 requests per minute.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Account created and verification OTP sent.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Account created successfully. Please check your email to verify your account.
                      data:
                        $ref: "#/components/schemas/SignUpUser"
                      links:
                        $ref: "#/components/schemas/UserLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/verify-email-otp":
    post:
      operationId: verifyEmailOtp
      summary: Verify an email address
      description: >
        Verify the user's email with the OTP sent at sign-up and activate the account. To protect
        user privacy, an unknown email, a wrong OTP, an expired OTP, and an OTP with no attempts
        left all return the same 400 error. Limited to 5 requests per minute.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerificationRequest"
      responses:
        "200":
          description: Email verified successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Email verified successfully.
                      links:
                        $ref: "#/components/schemas/SignInLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/resend-verification-otp":
    post:
      operationId: resendVerificationOtp
      summary: Resend the verification OTP
      description: >
        Send a new verification OTP. The old OTP stops working. To protect user privacy, the
        response is always the same, whether or not the email is registered or already verified.
        Limited to 5 requests per minute.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Request accepted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: If an account with this email exists, a verification code has been sent.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/forgot-password":
    post:
      operationId: forgotPassword
      summary: Request a password reset OTP
      description: >
        Send a password reset OTP to a registered email. If the email is not registered, it
        returns 404. Limited to 5 requests per minute.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Password reset OTP sent.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: A password reset code has been sent to your email.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/verify-reset-otp":
    post:
      operationId: verifyResetOtp
      summary: Verify the password reset OTP
      description: >
        Verify the OTP sent for a password reset. If it is correct, a reset token is set in the
        resetToken cookie (HttpOnly and Secure). The token is valid for 5 minutes and can be used
        only once. The token is not returned in the
        response body. An unknown email, a wrong OTP, an expired OTP, and an OTP with no attempts
        left (5 attempts) all return the same 400 error. Limited to 5 requests per minute.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerificationRequest"
      responses:
        "200":
          description: OTP verified. The reset token cookie is set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetResetTokenCookie"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: OTP verified. You can now reset your password.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/reset-password":
    patch:
      operationId: resetPassword
      summary: Reset the password
      description: >
        Set a new password using the reset token from POST /auth/verify-reset-otp. The token is
        read from the resetToken cookie, not from the request body or URL. All sessions of the
        user are logged out. Limited to 5 requests per minute.
      tags: [Auth]
      security:
        - resetTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successfully. The resetToken cookie is cleared.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Password reset successfully.
                      links:
                        $ref: "#/components/schemas/SignInLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/sign-in":
    post:
      operationId: signIn
      summary: Sign in
      description: >
        Sign in a user and return an access token. A new session is created for this device, and
        its refresh token is set in the refreshToken HttpOnly cookie. Only active accounts can
        sign in. Limited to 5 requests per minute.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Signed in successfully.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshTokenCookie"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Signed in successfully.
                      data:
                        $ref: "#/components/schemas/AccessToken"
                      links:
                        $ref: "#/components/schemas/SessionLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/refresh":
    post:
      operationId: refreshToken
      summary: Refresh the access token
      description: >
        Get a new access token for the device session in the refreshToken cookie. The refresh
        token itself does not change and stays valid for the whole session (30 days). It returns
        401 if the token is missing, invalid, or expired, or if the session was revoked.
      tags: [Auth]
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Token refreshed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Token refreshed successfully.
                      data:
                        $ref: "#/components/schemas/AccessToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/logout":
    post:
      operationId: logout
      summary: Log out the current device
      description: >
        End the session of the current device only. Other sessions stay active. You need both a
        valid access token and the refreshToken cookie of the same user, because the session to
        end is found from the refresh token.
      tags: [Auth]
      security:
        - bearerAuth: []
          refreshCookie: []
      responses:
        "200":
          description: Logged out. The refreshToken cookie is cleared.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Logged out successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/logout-all":
    post:
      operationId: logoutAll
      summary: Log out from all devices
      description: End all sessions of the signed-in user on every device.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out from all devices. The refreshToken cookie is cleared.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Logged out from all devices successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/sessions":
    get:
      operationId: listSessions
      summary: List active sessions
      description: >
        Get the active sessions of the signed-in user. The isCurrent field shows which session
        belongs to the access token.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of active sessions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Data retrieved successfully.
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/sessions/{sessionId}":
    delete:
      operationId: deleteSession
      summary: Log out a specific device
      description: >
        End one session and keep the other sessions active. The session must belong to the user
        making the request.
      tags: [Auth]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/sessionIdPathParam"
      responses:
        "204":
          description: Session ended.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------- Article routes ----------
  "/articles":
    get:
      operationId: listArticles
      summary: List published articles
      description: Get published articles. Anyone can use this endpoint. It supports pagination, sorting, title search, and category filter.
      tags: [Article]
      parameters:
        - $ref: "#/components/parameters/pageParam"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/sortTypeParam"
        - $ref: "#/components/parameters/sortByParam"
        - $ref: "#/components/parameters/searchParam"
        - $ref: "#/components/parameters/categoryParam"
      responses:
        "200":
          description: List of published articles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ArticleListItem"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
                      links:
                        $ref: "#/components/schemas/ArticleListLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      operationId: createArticle
      summary: Create an article
      description: >
        Create an article with a cover image. The category must exist and be active. New articles
        are published right away. The cover file must be a JPG, JPEG, PNG, or WebP image up to
        5 MB.
      tags: [Article]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateArticleRequest"
      responses:
        "201":
          description: Article created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Article created successfully.
                      data:
                        $ref: "#/components/schemas/Article"
                      links:
                        $ref: "#/components/schemas/ArticleSelfLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  "/articles/admin/all":
    get:
      operationId: listAllArticles
      summary: List all articles (admin)
      description: Get both published and draft articles. Only administrators can do this.
      tags: [Article]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/pageParam"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/sortTypeParam"
        - $ref: "#/components/parameters/sortByParam"
        - $ref: "#/components/parameters/searchParam"
        - $ref: "#/components/parameters/categoryParam"
        - $ref: "#/components/parameters/articleStatusParam"
      responses:
        "200":
          description: List of all articles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AdminArticleListItem"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
                      links:
                        $ref: "#/components/schemas/AdminArticleListLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  "/articles/{id}":
    get:
      operationId: getArticle
      summary: Get an article
      description: >
        Anyone can view a published article. A draft article can only be viewed by its author or
        an administrator. For everyone else, the response is the same as if the article does not
        exist. An invalid bearer token is rejected with 401, even though signing in is optional.
      tags: [Article]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPathParam"
        - $ref: "#/components/parameters/articleExpandParam"
      responses:
        "200":
          description: The article.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ArticleDetails"
                      links:
                        $ref: "#/components/schemas/ArticleLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    patch:
      operationId: updateArticle
      summary: Update an article
      description: >
        Update some fields of an article. Only the article owner can do this. Administrators
        cannot edit other users' articles. If you send a category, it must exist and be active. A
        new cover replaces the old image. Sending status here returns 400.
      tags: [Article]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPathParam"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PatchArticleRequest"
      responses:
        "200":
          description: Article updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Article updated successfully.
                      data:
                        $ref: "#/components/schemas/Article"
                      links:
                        $ref: "#/components/schemas/ArticleSelfLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      operationId: deleteArticle
      summary: Delete an article
      description: >
        Delete an article with its comments and cover image. Only the article owner or an
        administrator can do this.
      tags: [Article]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPathParam"
      responses:
        "204":
          description: Article deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  "/articles/{id}/status":
    patch:
      operationId: updateArticleStatus
      summary: Update an article's status (admin)
      description: >
        Change an article's status between draft and published, for example to unpublish an
        article. Only administrators can do this.
      tags: [Article]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleStatusRequest"
      responses:
        "200":
          description: Article status updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Article status updated successfully.
                      data:
                        $ref: "#/components/schemas/Article"
                      links:
                        $ref: "#/components/schemas/ArticleSelfLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  "/articles/{id}/author":
    get:
      operationId: getArticleAuthor
      summary: Get the article author
      description: Get the public details of the author of a published article. A draft article returns 404.
      tags: [Article]
      parameters:
        - $ref: "#/components/parameters/idPathParam"
      responses:
        "200":
          description: The article author.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthorDetails"
                      links:
                        $ref: "#/components/schemas/ArticleAuthorLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  "/articles/{id}/comments":
    get:
      operationId: listArticleComments
      summary: List article comments
      description: >
        Get the public comments of a published article as a tree, where each comment includes its
        replies. Pagination applies to top-level comments only.
      tags: [Article]
      parameters:
        - $ref: "#/components/parameters/idPathParam"
        - $ref: "#/components/parameters/pageParam"
        - $ref: "#/components/parameters/limitParam"
      responses:
        "200":
          description: List of comments with their replies.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommentTreeNode"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
                      links:
                        $ref: "#/components/schemas/ArticleCommentListLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      operationId: createArticleComment
      summary: Comment on an article
      description: Add a top-level comment to a published article.
      tags: [Article]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentBodyRequest"
      responses:
        "201":
          description: Comment posted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Comment posted successfully.
                      data:
                        $ref: "#/components/schemas/Comment"
                      links:
                        $ref: "#/components/schemas/ArticleCommentLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  "/articles/{articleId}/comments/{commentId}/replies":
    post:
      operationId: createCommentReply
      summary: Reply to a comment
      description: >
        Add a reply to a visible comment on a published article. The parent comment ID comes from
        the URL, not from the request body. Replying to a hidden comment returns 404.
      tags: [Article]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/articleIdPathParam"
        - $ref: "#/components/parameters/commentIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentBodyRequest"
      responses:
        "201":
          description: Reply posted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Reply posted successfully.
                      data:
                        $ref: "#/components/schemas/Comment"
                      links:
                        $ref: "#/components/schemas/CommentReplyLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------- Category routes ----------
  "/categories":
    get:
      operationId: listCategories
      summary: List categories
      description: >
        Get categories for browsing, or for filtering, searching, and sorting articles. Public
        users see only active categories. Administrators see all categories and can filter by
        status. An invalid bearer token is rejected with 401, even though signing in is optional.
      tags: [Category]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/pageParam"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/sortTypeParam"
        - $ref: "#/components/parameters/categorySortByParam"
        - $ref: "#/components/parameters/categorySearchParam"
        - $ref: "#/components/parameters/categoryStatusParam"
      responses:
        "200":
          description: List of categories.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CategoryListItem"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
                      links:
                        $ref: "#/components/schemas/CategoryListLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      operationId: createCategory
      summary: Create a category (admin)
      description: Create a new active category. The name must be unique. Only administrators can do this.
      tags: [Category]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Category created successfully.
                      data:
                        $ref: "#/components/schemas/Category"
                      links:
                        $ref: "#/components/schemas/CategoryLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  "/categories/{id}":
    get:
      operationId: getCategory
      summary: Get a category
      description: >
        Get one category. Public users can only get active categories. Administrators can also
        get unavailable ones. An invalid bearer token is rejected with 401, even though signing
        in is optional.
      tags: [Category]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPathParam"
      responses:
        "200":
          description: The category.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Category"
                      links:
                        $ref: "#/components/schemas/CategoryLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    patch:
      operationId: updateCategory
      summary: Update a category (admin)
      description: >
        Update the name or description of a category. Send at least one field. The name must stay
        unique. Only administrators can do this.
      tags: [Category]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Category updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Category updated successfully.
                      data:
                        $ref: "#/components/schemas/Category"
                      links:
                        $ref: "#/components/schemas/CategoryLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  "/categories/{id}/status":
    patch:
      operationId: updateCategoryStatus
      summary: Update a category's status (admin)
      description: >
        Mark a category as active or unavailable. Categories cannot be deleted. Unavailable
        categories are hidden from public lists, but articles that already use them stay valid.
        Only administrators can do this.
      tags: [Category]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryStatusRequest"
      responses:
        "200":
          description: Category status updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Category status updated successfully.
                      data:
                        $ref: "#/components/schemas/Category"
                      links:
                        $ref: "#/components/schemas/CategoryLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------- Comment routes ----------
  "/comments":
    get:
      operationId: listComments
      summary: List all comments (admin)
      description: >
        Get all comments, including hidden ones, as they are stored. You can filter by article and status. If the articleId
        filter points to an article that does not exist, it returns 404. Only administrators can
        do this.
      tags: [Comment]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/pageParam"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/sortTypeParam"
        - $ref: "#/components/parameters/basicSortByParam"
        - $ref: "#/components/parameters/articleIdFilterParam"
        - $ref: "#/components/parameters/commentStatusParam"
      responses:
        "200":
          description: List of comments.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/StoredComment"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
                      links:
                        $ref: "#/components/schemas/CommentListLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  "/comments/{id}":
    patch:
      operationId: updateComment
      summary: Update a comment
      description: >
        Update the text of a comment or reply. Only the comment owner can do this. Administrators
        cannot edit other users' comments.
      tags: [Comment]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentBodyRequest"
      responses:
        "200":
          description: Comment updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Comment updated successfully.
                      data:
                        $ref: "#/components/schemas/StoredComment"
                      links:
                        $ref: "#/components/schemas/CommentLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      operationId: deleteComment
      summary: Delete a comment
      description: >
        Delete a comment together with all of its replies, including nested replies. The delete
        is all-or-nothing. Only the comment owner or an administrator can do this.
      tags: [Comment]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPathParam"
      responses:
        "204":
          description: Comment and its replies deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  "/comments/{id}/status":
    patch:
      operationId: updateCommentStatus
      summary: Update a comment's status (admin)
      description: Hide or show a comment. Only administrators can do this.
      tags: [Comment]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentStatusRequest"
      responses:
        "200":
          description: Comment status updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Comment status updated successfully.
                      data:
                        $ref: "#/components/schemas/StoredComment"
                      links:
                        $ref: "#/components/schemas/CommentLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------- User routes ----------
  "/users":
    get:
      operationId: listUsers
      summary: List users (admin)
      description: Get users with filtering, sorting, and pagination. Only administrators can do this.
      tags: [User]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/pageParam"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/sortTypeParam"
        - $ref: "#/components/parameters/userSortByParam"
        - $ref: "#/components/parameters/nameParam"
        - $ref: "#/components/parameters/emailParam"
        - $ref: "#/components/parameters/userStatusParam"
      responses:
        "200":
          description: List of users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
                      links:
                        $ref: "#/components/schemas/UserListLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      operationId: createUser
      summary: Create a user (admin)
      description: >
        Create a user account with the given role. The account is active right away. If the email
        is already registered, the request is rejected. Only administrators can do this.
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateUserRequest"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Account created successfully.
                      data:
                        $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  "/users/{id}/change-password":
    patch:
      operationId: changePassword
      summary: Change a password
      description: >
        Change the password of the signed-in user. Only the account owner can do this. A wrong
        oldPassword returns 400. After a successful change, all other sessions are logged out and
        the current session stays active.
      tags: [User]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Password updated successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  "/users/{id}":
    get:
      operationId: getUser
      summary: Get a user
      description: Get one user. A user can get their own details. An administrator can get any user.
      tags: [User]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPathParam"
        - $ref: "#/components/parameters/userExpandParam"
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserDetails"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    patch:
      operationId: updateUser
      summary: Update a user (admin)
      description: >
        Update a user's name, role, or account status. The status can only change between active
        and blocked. Accounts leave pending when the email is verified. It returns 409 if the
        status change is not allowed, if an administrator tries to block or demote their own
        account, or if the change would remove the last active administrator. Only administrators
        can do this.
      tags: [User]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Account updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: Account updated successfully.
                      data:
                        $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      operationId: deleteUser
      summary: Delete a user (admin)
      description: >
        Delete a user together with their sessions, OTPs, reset tokens, and articles (including
        cover images). Also delete every comment they wrote and every comment on their articles,
        including replies from other users. It returns 409 if an administrator tries to delete
        their own account or the last active administrator. Only administrators can do this.
      tags: [User]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPathParam"
      responses:
        "204":
          description: Account and related data deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken

    resetTokenCookie:
      type: apiKey
      in: cookie
      name: resetToken

  headers:
    SetRefreshTokenCookie:
      description: The refreshToken cookie. It holds the refresh token for the device and is HttpOnly, Secure, and SameSite=Strict.
      schema:
        type: string
        example: refreshToken=eyJhbGciOiJIUzI1NiIs...; HttpOnly; Secure; SameSite=Strict
    SetResetTokenCookie:
      description: The resetToken cookie. It holds the single-use password reset token and is HttpOnly, Secure, and SameSite=Strict.
      schema:
        type: string
        example: resetToken=3f9c0a...; HttpOnly; Secure; SameSite=Strict

  schemas:
    # ---------- Shared building blocks ----------
    SuccessResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: 200
        message:
          type: string
          example: Data retrieved successfully.
      required: [code, message]

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: 400
        error:
          type: string
          example: Bad request
        correlationId:
          type: string
          example: 2b6d4a52-6c6e-4ac4-8f3e-2f6f4d6e9a11
        message:
          type: string
          example: Invalid input.
        data:
          description: Extra details about the error. For 400 errors, this is a list of fields with problems.
      required: [code, error, message]

    ValidationErrorItem:
      type: object
      properties:
        field:
          type: string
          example: title
        message:
          type: string
          example: Title is required.
        in:
          type: string
          enum: [params, query, body, file]
          example: body
      required: [field, message, in]

    Timestamp:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [createdAt, updatedAt]

    Pagination:
      type: object
      properties:
        page:
          type: integer
          format: int32
          example: 2
        limit:
          type: integer
          format: int32
          example: 10
        totalItems:
          type: integer
          format: int32
          example: 200
        totalPage:
          type: integer
          format: int32
          example: 20
        next:
          type: integer
          format: int32
          description: Only present when there is a next page.
          example: 3
        prev:
          type: integer
          format: int32
          description: Only present when there is a previous page.
          example: 1
      required: [page, limit, totalPage, totalItems]

    AuthorDetails:
      type: object
      properties:
        id:
          type: string
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          example: Md Ismile Hosen Siam
      required: [id, name]

    CategoryDetails:
      type: object
      properties:
        id:
          type: string
          example: 665f1a2b3c4d5e6f70910203
        name:
          type: string
          example: Technology
      required: [id, name]

    # ---------- Links ----------
    SignInLinks:
      type: object
      properties:
        sign-in:
          type: string
          format: uri-reference
          example: /api/v1/auth/sign-in

    SessionLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
          example: /api/v1/auth/sessions

    UserLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
          example: /api/v1/users/507f1f77bcf86cd799439011

    ArticleLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
          example: /api/v1/articles/507f1f77bcf86cd799439011
        author:
          type: string
          format: uri-reference
          example: /api/v1/articles/507f1f77bcf86cd799439011/author
        comments:
          type: string
          format: uri-reference
          example: /api/v1/articles/507f1f77bcf86cd799439011/comments

    ArticleSelfLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
          example: /api/v1/articles/507f1f77bcf86cd799439011

    ArticleAuthorLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
          example: /api/v1/articles/507f1f77bcf86cd799439011/author
        article:
          type: string
          format: uri-reference
          example: /api/v1/articles/507f1f77bcf86cd799439011

    ArticleCommentLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
          example: /api/v1/articles/507f1f77bcf86cd799439011/comments
        article:
          type: string
          format: uri-reference
          example: /api/v1/articles/507f1f77bcf86cd799439011

    CommentReplyLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
          example: /api/v1/articles/507f1f77bcf86cd799439011/comments/507f191e810c19729de860ea/replies
        article:
          type: string
          format: uri-reference
          example: /api/v1/articles/507f1f77bcf86cd799439011

    CategoryLinks:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
