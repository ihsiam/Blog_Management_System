  responses:
    BadRequest:
      description: >
        The request is not valid. The data field lists the fields with problems. It is null when
        there are no field details, for example for an invalid or expired OTP.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - type: object
                properties:
                  code:
                    example: 400
                  error:
                    example: Bad request
                  data:
                    type: array
                    nullable: true
                    items:
                      $ref: "#/components/schemas/ValidationErrorItem"

    Unauthorized:
      description: The credentials are missing, invalid, or expired, or the session was revoked.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - type: object
                properties:
                  code:
                    example: 401
                  error:
                    example: Unauthorized
                  message:
                    example: Authorization token is missing.

    Forbidden:
      description: The account is not active, or the user is not allowed to do this.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - type: object
                properties:
                  code:
                    example: 403
                  error:
                    example: Forbidden
                  message:
                    example: You are not allowed to access this resource.

    NotFound:
      description: The resource was not found.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - type: object
                properties:
                  code:
                    example: 404
                  error:
                    example: Not found
                  message:
                    example: The requested resource was not found.

    Conflict:
      description: >
        The request conflicts with existing data, for example a duplicate value or a rule that
        protects the system. See the operation description for details.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - type: object
                properties:
                  code:
                    example: 409
                  error:
                    example: Conflict
                  message:
                    example: This value already exists.

    TooManyRequests:
      description: Too many requests. The limit is 5 requests per minute for each IP address.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 429
              error:
                type: string
                example: Too many requests
              message:
                type: string
                example: Too many attempts. Please try again later.
            required: [code, error, message]

    ServerError:
      description: Something went wrong on the server.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - type: object
                properties:
                  code:
                    example: 500
                  error:
                    example: Internal server error
                  message:
                    example: Something went wrong. Please try again later.

  parameters:
    pageParam:
      in: query
      name: page
      description: Page number to return.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
        example: 2

    limitParam:
      in: query
      name: limit
      description: Number of items per page.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 10
        example: 10

    sortTypeParam:
      in: query
      name: sortType
      description: Sort order. Use asc for ascending or desc for descending.
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
        example: desc

    sortByParam:
      in: query
      name: sortBy
      description: Field to sort articles by. Use createdAt, updatedAt, or title.
      required: false
      schema:
        type: string
        enum: [createdAt, updatedAt, title]
        default: createdAt
        example: createdAt

    basicSortByParam:
      in: query
      name: sortBy
      description: Field to sort by. Use createdAt or updatedAt.
      required: false
      schema:
        type: string
        enum: [createdAt, updatedAt]
        default: createdAt
        example: createdAt

    categorySortByParam:
      in: query
      name: sortBy
      description: Field to sort categories by. Use createdAt or name.
      required: false
      schema:
        type: string
        enum: [createdAt, name]
        default: createdAt
        example: createdAt

    userSortByParam:
      in: query
      name: sortBy
      description: Field to sort users by. Use createdAt, updatedAt, email, or name.
      required: false
      schema:
        type: string
        enum: [createdAt, updatedAt, email, name]
        default: createdAt
        example: createdAt

    searchParam:
      in: query
      name: search
      description: Search articles by title. Not case-sensitive. Maximum 100 characters.
      required: false
      schema:
        type: string
        maxLength: 100
        example: title

    categorySearchParam:
      in: query
      name: search
      description: Search categories by name. Not case-sensitive. Maximum 100 characters.
      required: false
      schema:
        type: string
        maxLength: 100
        example: Technology

    categoryParam:
      in: query
      name: category
      description: Filter articles by category ID.
      required: false
      schema:
        type: string
        example: 665f1a2b3c4d5e6f70910203

    articleStatusParam:
      in: query
      name: status
      description: Filter articles by status.
      required: false
      schema:
        type: string
        enum: [draft, published]
        example: draft

    categoryStatusParam:
      in: query
      name: status
      description: Filter categories by status. This works for administrators only. Public users always get active categories.
      required: false
      schema:
        type: string
        enum: [active, unavailable]
        example: unavailable

    commentStatusParam:
      in: query
      name: status
      description: Filter comments by status.
      required: false
      schema:
        type: string
        enum: [public, hidden]
        example: hidden

    userStatusParam:
      in: query
      name: status
      description: Filter users by account status.
      required: false
      schema:
        type: string
        enum: [pending, active, blocked]
        example: pending

    articleIdFilterParam:
      in: query
      name: articleId
      description: Filter comments by article ID.
      required: false
      schema:
        type: string
        example: 507f1f77bcf86cd799439011

    nameParam:
      in: query
      name: name
      description: Filter users by name. Not case-sensitive. Maximum 100 characters.
      required: false
      schema:
        type: string
        maxLength: 100
        example: Siam

    emailParam:
      in: query
      name: email
      description: Filter users by email. Not case-sensitive. Maximum 100 characters.
      required: false
      schema:
        type: string
        maxLength: 100
        example: example@gmail.com

    articleExpandParam:
      in: query
      name: expand
      description: Extra data to include in the response, as a comma-separated list. Only comments is supported.
      required: false
      schema:
        type: string
        example: comments

    userExpandParam:
      in: query
      name: expand
      description: Extra data to include in the response, as a comma-separated list. Supported values are articles and comments.
      required: false
      schema:
        type: string
        example: articles,comments

    idPathParam:
      in: path
      name: id
      description: ID of the resource.
      required: true
      schema:
        type: string
        example: 507f1f77bcf86cd799439011

    sessionIdPathParam:
      in: path
      name: sessionId
      description: ID of the session. You can get it from GET /auth/sessions.
      required: true
      schema:
        type: string
        example: 665f1a2b3c4d5e6f70910203

    articleIdPathParam:
      in: path
      name: articleId
      description: ID of the article.
      required: true
