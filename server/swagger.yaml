                  message:
                    type: string
                    example: Password updated successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  "/users/{id}":
    get:
      operationId: getUser
      summary: Get user
      description: Retrieve a single user. Usually restricted to admins or the user themselves.
      tags: [User]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPathParam"
        - in: query
          name: expand
          description: >
            Related resources to include in the response. articles and comments
            are included only when explicitly requested here.
          required: false
          schema:
            type: array
            items:
              type: string
              enum: [articles, comments]
          style: form
          explode: false
          example: "articles,comments"
      responses:
        "200":
          description: Retrieved a user
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                    example: Data retrieved.
                  data:
                    allOf:
                      - $ref: "#/components/schemas/User"
                      - type: object
                        properties:
                          articles:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  example: 507f1f77bcf86cd799439011
                                title:
                                  type: string
                                  example: first article
                                status:
                                  type: string
                                  enum: [draft, published]
                                  example: published
                          comments:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  example: 507f1f77bcf86cd799439011
                                body:
                                  type: string
                                  example: this is a comment
                                status:
                                  type: string
                                  enum: [public, hidden]
                                  example: public
                                article:
                                  type: string
                                  example: 507f1f77bcf86cd799439011
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    patch:
      operationId: updateUser
      summary: Update user
      description: >
        Administrative endpoint to update a user's info. Account status may only be
        changed between active and blocked; accounts move out of pending automatically
        via email verification.
      tags: [User]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Account updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                    example: Account updated.
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      operationId: deleteUser
      summary: Delete user
      description: >
        Administrative endpoint to delete a user. The system will not allow
        deletion of the last active administrator.
      tags: [User]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPathParam"
      responses:
        "204":
          description: Account deleted successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cannot delete the last active administrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 409
                  error:
                    type: string
                    example: Conflict
                  correlationId:
                    type: string
                    example: "1781953113407"
                  message:
                    type: string
                    example: Cannot delete the last active administrator.
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken

    resetTokenCookie:
      type: apiKey
      in: cookie
      name: resetToken

  schemas:
    Article:
      allOf:
        - type: object
          properties:
            id:
              type: string
              example: 507f1f77bcf86cd799439011
            title:
              type: string
              example: first article
            body:
              type: string
              example: first article body
            cover:
              type: string
              format: uri
              example: https://s.aws.com/myfirstblog/123.jpg
            status:
              type: string
              enum: [draft, published]
              default: published
              example: published
          required: [id, title, body, status]
        - $ref: "#/components/schemas/Timestamp"

    Category:
      allOf:
        - type: object
          properties:
            id:
              type: string
              example: 665f1a2b3c4d5e6f70910203
            name:
              type: string
              example: Technology
            description:
              type: string
              nullable: true
              example: Articles about software and tech trends
            status:
              type: string
              enum: [active, unavailable]
              example: active
          required: [id, name, status]
        - $ref: "#/components/schemas/Timestamp"

    User:
      allOf:
        - type: object
          properties:
            id:
              type: string
              example: 507f1f77bcf86cd799439011
            name:
              type: string
              example: Md Ismile Hosen Siam
            email:
              type: string
              format: email
              example: example@gmail.com
            role:
              type: string
              enum: [admin, user]
              example: user
            status:
              type: string
              enum: [pending, active, blocked]
              example: pending
          required: [id, name, email, role, status]
        - $ref: "#/components/schemas/Timestamp"

    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
          example: Md Ismile Hosen Siam
        email:
          type: string
          format: email
          example: example@gmail.com
        password:
          type: string
          format: password
          minLength: 8
          example: password1234
      required: [name, email, password]

    AdminCreateUserRequest:
      type: object
      properties:
        name:
          type: string
          example: Md Ismile Hosen Siam
        email:
          type: string
          format: email
          example: example@gmail.com
        password:
          type: string
          format: password
          minLength: 8
          example: password1234
        role:
          type: string
          enum: [user, admin]
          example: user
      required: [name, email, password, role]

    UserCreateUpdateResponse:
      allOf:
        - type: object
          properties:
            id:
              type: string
              example: 507f1f77bcf86cd799439011
            name:
              type: string
              example: Md Ismile Hosen Siam
            email:
              type: string
              format: email
              example: example@gmail.com
        - $ref: "#/components/schemas/Timestamp"

    CreateArticleRequest:
      type: object
      properties:
        title:
          type: string
          example: first article
        body:
          type: string
          example: first article body
        category:
          type: string
          example: 665f1a2b3c4d5e6f70910203
          description: Category ID
        cover:
          type: string
          format: binary
          description: Cover image file (JPG, JPEG, PNG, or WebP; max 5 MB)
      required: [title, body, category, cover]

    PatchArticleRequest:
      type: object
      properties:
        title:
          type: string
          example: updated title
        body:
          type: string
          example: updated body
        category:
          type: string
          example: 665f1a2b3c4d5e6f70910203
          description: Category ID
        cover:
          type: string
          format: binary
          description: Cover image file (JPG, JPEG, PNG, or WebP; max 5 MB)

    ArticleStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [draft, published]
          example: published
      required: [status]

    CreateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          example: Technology
        description:
          type: string
          nullable: true
          example: Articles about software and tech trends
      required: [name]

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          example: Technology
        description:
          type: string
          nullable: true
          example: Articles about software and tech trends
      required: [name]

    CategoryStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [active, unavailable]
          example: unavailable
      required: [status]

    CategoryDetails:
      type: object
      properties:
        id:
          type: string
          example: 665f1a2b3c4d5e6f70910203
        name:
          type: string
          example: Technology
      required: [id, name]

    Comment:
      allOf:
        - type: object
          properties:
            id:
              type: string
              example: 507f1f77bcf86cd799439011
            body:
              type: string
              example: first comment
            status:
              type: string
              enum: [hidden, public]
              example: public
            article:
              type: string
              example: 507f1f77bcf86cd799439011
            author:
              $ref: "#/components/schemas/AuthorDetails"
            parentCommentId:
              type: string
              nullable: true
              example: null
          required: [id, body, status, article, author]
        - $ref: "#/components/schemas/Timestamp"

    CommentTreeNode:
      allOf:
        - type: object
          properties:
            id:
              type: string
              example: 507f1f77bcf86cd799439011
            body:
              type: string
              example: this is a comment
            author:
              $ref: "#/components/schemas/AuthorDetails"
            replies:
              type: array
              items:
                $ref: "#/components/schemas/CommentTreeNode"
              example:
                - id: 507f191e810c19729de860ea
                  body: Great point, I agree!
                  author:
                    id: 507f1f77bcf86cd799439012
                    name: Jane Doe
                  replies: []
                  createdAt: "2026-09-20T10:15:00.000Z"
                  updatedAt: "2026-09-20T10:15:00.000Z"
          required: [id, body, author, replies]
        - $ref: "#/components/schemas/Timestamp"

    CreateArticleCommentRequest:
      type: object
      properties:
        body:
          type: string
          example: this is a comment
      required: [body]

    UpdateCommentRequest:
      type: object
      properties:
        body:
          type: string
          example: this is a comment
      required: [body]

    CommentStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [public, hidden]
          example: hidden
      required: [status]

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          example: Md Ismile Hosen Siam
        role:
          type: string
          enum: [user, admin]
          example: user
        status:
          type: string
          enum: [active, blocked]
          description: >
            Accounts move out of pending automatically via email verification;
            administrators may only block an active user or unblock a blocked one.
          example: active

    OtpVerificationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: example@gmail.com
        otp:
          type: string
          example: "123456"
      required: [email, otp]

    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: example@gmail.com
      required: [email]

    Session:
      type: object
      properties:
        id:
          type: string
          example: 665f1a2b3c4d5e6f70910203
        deviceInfo:
          type: string
          example: Chrome on Windows 11
        isCurrent:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required: [id, deviceInfo, isCurrent, createdAt, expiresAt]

    Timestamp:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [createdAt, updatedAt]

    AuthorDetails:
      type: object
      properties:
        id:
          type: string
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          example: Md Ismile Hosen Siam
      required: [id, name]

    Pagination:
      type: object
      properties:
        page:
          type: integer
          format: int32
          example: 2
        limit:
          type: integer
          format: int32
          example: 10
        next:
          type: integer
          format: int32
          example: 3
        prev:
          type: integer
          format: int32
          example: 1
        totalPage:
          type: integer
          format: int32
          example: 20
        totalItems:
          type: integer
          format: int32
          example: 200
      required: [page, limit, totalPage, totalItems]

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 400
              error:
                type: string
                example: Bad Request
              correlationId:
                type: string
                example: "1781953113407"
              message:
                type: string
                example: Validation failed.
              data:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                      example: field name
                    message:
                      type: string
                      example: invalid input
                    in:
                      type: string
                      enum: [path, query, header, cookie, body]
                      example: body

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 500
              error:
                type: string
                example: Internal Server Error
              correlationId:
                type: string
                example: "1781953113407"
              message:
                type: string
                example: We are sorry for the inconvenience. Please try again later.

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 401
              error:
                type: string
                example: Unauthorized
              correlationId:
                type: string
                example: "1781953113407"
              message:
                type: string
                example: Unauthorized.

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 403
              error:
                type: string
                example: Forbidden
              correlationId:
                type: string
                example: "1781953113407"
              message:
                type: string
                example: You do not have permission.

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 404
              error:
                type: string
                example: Not Found
              correlationId:
                type: string
                example: "1781953113407"
              message:
                type: string
                example: Requested resource not found.

    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 429
              error:
                type: string
                example: Too Many Requests
              correlationId:
                type: string
                example: "1781953113407"
              message:
                type: string
                example: Too many requests. Please try again later.

    ArticleCreated:
      description: Article created
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 201
              message:
                type: string
                example: Article created.
              data:
                allOf:
                  - $ref: "#/components/schemas/Article"
                  - type: object
                    properties:
                      author:
                        $ref: "#/components/schemas/AuthorDetails"
                      category:
                        $ref: "#/components/schemas/CategoryDetails"
              links:
                type: object
                properties:
                  self:
                    type: string
                    format: uri
                    example: "/articles/507f1f77bcf86cd799439011"

    ArticleUpdated:
      description: Article updated
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 200
              message:
                type: string
                example: Successfully updated article data.
              data:
                allOf:
                  - $ref: "#/components/schemas/Article"
                  - type: object
                    properties:
                      author:
                        $ref: "#/components/schemas/AuthorDetails"
                      category:
                        $ref: "#/components/schemas/CategoryDetails"
              links:
                type: object
                properties:
                  self:
                    type: string
                    format: uri
                    example: "/articles/507f1f77bcf86cd799439011"

  parameters:
    pageParam:
      in: query
      name: page
      description: Current page number
      required: false
      schema:
        type: integer
        format: int32
        default: 1
        example: 2

    limitParam:
      in: query
      name: limit
      description: Number of items to return
      required: false
      schema:
        type: integer
        format: int32
        default: 10
        example: 10

    sortTypeParam:
      in: query
      name: sortType
      description: Sort in ascending or descending order
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
        example: desc

    sortByParam:
      in: query
      name: sortBy
      description: Sort by updatedAt, createdAt or title
      required: false
      schema:
        type: string
        enum: [updatedAt, createdAt, title]
        default: createdAt
        example: createdAt

    basicSortByParam:
      in: query
      name: sortBy
      description: Sort by createdAt or updatedAt
      required: false
      schema:
        type: string
        enum: [createdAt, updatedAt]
        default: createdAt
        example: createdAt

    categorySortByParam:
      in: query
      name: sortBy
      description: Sort by createdAt or name
      required: false
      schema:
        type: string
        enum: [createdAt, name]
        default: createdAt
        example: createdAt

    searchParam:
      in: query
      name: search
      description: Search article by title
      required: false
      schema:
        type: string
        example: title

    categorySearchParam:
      in: query
      name: search
      description: Search categories by name
      required: false
      schema:
        type: string
        example: Technology

    categoryParam:
      in: query
      name: category
      description: Filter articles by category ID
      required: false
      schema:
        type: string
        example: 665f1a2b3c4d5e6f70910203

    articleStatusParam:
      in: query
      name: status
      description: Filter articles by publication status
      required: false
      schema:
        type: string
        enum: [draft, published]
        example: draft

    commentStatusParam:
      in: query
      name: status
      description: Filter comments by visibility status
      required: false
      schema:
        type: string
        enum: [public, hidden]
        example: hidden

    userStatusParam:
      in: query
      name: status
      description: Filter users by account status
      required: false
      schema:
        type: string
        enum: [pending, active, blocked]
        example: pending

    articleIdFilterParam:
      in: query
      name: articleId
      description: Filter comments by article ID
      required: false
      schema:
        type: string
        example: 507f1f77bcf86cd799439011

    nameParam:
      in: query
      name: name
      description: Filter users by name
      required: false
      schema:
        type: string
        example: Siam

    emailParam:
      in: query
      name: email
      description: Filter users by email
      required: false
      schema:
        type: string
        format: email
        example: test@gmail.com

    idPathParam:
      in: path
      name: id
      required: true
      schema:
        type: string
        example: 507f1f77bcf86cd799439011
