openapi: 3.0.0
info:
  version: "1.0.0"
  title: "Blog Management System API"
  description: |
    The Blog Management System API is a backend REST API that enables users to register, verify
    their email via a one-time password (OTP), and authenticate using JWT-based authentication
    (short-lived access tokens and device-scoped refresh tokens delivered via an HttpOnly, Secure
    cookie). The system supports multi-device sessions, allowing a user to be signed in on several
    devices at once and to log out from the current device, all devices, or a specific device, as
    well as view their active sessions.

    The API supports two authenticated roles: registered users, who can create, update, and delete
    their own articles and comment or reply on articles, and administrators, who additionally manage
    users, categories, and system-wide content moderation. Unauthenticated guests have read-only
    access to published articles, article details, active categories, and public comments.

    Blog content is organized around three core resources: articles, categories, and comments.
    Every article belongs to exactly one category, and categories support classification as well as
    filtering, searching, and sorting on article listings; categories are never permanently deleted,
    only toggled between active and unavailable. Article cover images are uploaded as files and
    stored in cloud object storage, with allowed types of JPG, JPEG, PNG, and WebP up to 5 MB.
    Comments support nested, threaded replies, and deleting a comment also deletes all of its direct
    and nested replies.

    Password recovery follows an OTP-based flow: a reset OTP is emailed to the user, and on
    verification a short-lived (5-minute), single-use reset token is issued via an HttpOnly, Secure
    cookie rather than a URL or request body, which is then required to complete the password reset.
    Sensitive endpoints (sign-in, password reset, and OTP-related routes) are rate-limited to 5
    requests per minute, and all passwords are hashed with bcrypt.

    The API provides advanced querying capabilities such as pagination, filtering, sorting, and
    searching to efficiently retrieve blog data.

    The application follows production-grade backend practices including caching (Redis), structured
    logging with centralized aggregation (Winston and the ELK stack), automated testing, and
    comprehensive error handling. For scalable and reliable deployment, the system is containerized
    using Docker and supports load balancing, MongoDB replication, and CI/CD pipelines.
  contact:
    name: Md Ismile Hosen Siam
    email: siam679ihs@gmail.com

servers:
  - description: dev
    url: http://localhost:3000/api/v1

tags:
  - name: Auth
    description: Auth endpoints
  - name: Article
    description: Article endpoints
  - name: Category
    description: Category endpoints
  - name: Comment
    description: Comment endpoints
  - name: User
    description: User endpoints

paths:
  # ==================================================
  # Authentication Routes
  # ==================================================
  "/auth/setup-admin":
    post:
      operationId: setupAdmin
      summary: Setup initial admin
      description: Create the initial admin account. This endpoint should only succeed once.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Admin account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 201
                  message:
                    type: string
                    example: System administrator created successfully.
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  links:
                    type: object
                    properties:
                      sign-in:
                        type: string
                        format: uri
                        example: "/auth/sign-in"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Admin already configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 409
                  error:
                    type: string
                    example: Conflict
                  correlationId:
                    type: string
                    example: "1781953113407"
                  message:
                    type: string
                    example: System administrator already configured.
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/sign-up":
    post:
      operationId: signUp
      summary: Create user account
      description: >
        Register a new user account and send a verification OTP to the user's email.
        Rejects with 400 if the email is already registered.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Sign-up successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 201
                  message:
                    type: string
                    example: Account created successfully. Please check your email for a verification code.
                  data:
                    allOf:
                      - $ref: "#/components/schemas/UserCreateUpdateResponse"
                      - type: object
                        properties:
                          status:
                            type: string
                            enum: [pending, active, blocked]
                            example: pending
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: "/auth/sign-up"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/verify-email-otp":
    post:
      operationId: verifyEmailOtp
      summary: Verify email
      description: >
        Verify a user's email address using the OTP sent during registration. To prevent
        account enumeration, an unknown email and an invalid or expired OTP return the
        same generic error. Rate limited to 5 requests per minute.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerificationRequest"
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                    example: Email verified successfully.
                  links:
                    type: object
                    properties:
                      sign-in:
                        type: string
                        format: uri
                        example: "/auth/sign-in"
        "400":
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  correlationId:
                    type: string
                    example: "1781953113407"
                  message:
                    type: string
                    example: Invalid or expired OTP.
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/resend-verification-otp":
    post:
      operationId: resendVerificationOtp
      summary: Resend verification OTP
      description: >
        Resend a new OTP for email verification. To prevent account enumeration, this
        endpoint always responds with the same generic success message regardless of
        whether the email is registered or already verified. Rate limited to 5 requests
        per minute.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Verification OTP request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                    example: If an account with that email exists, a verification code has been sent.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/forgot-password":
    post:
      operationId: forgotPassword
      summary: Forgot password
      description: >
        Request a password reset OTP to be sent to the user's registered email address.
        To prevent account enumeration, this endpoint always responds with the same
        generic success message regardless of whether the email is registered. Rate
        limited to 5 requests per minute.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Password reset OTP request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                    example: If an account with that email exists, a password reset code has been sent.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/verify-reset-otp":
    post:
      operationId: verifyResetOtp
      summary: Verify password reset OTP
      description: >
        Verify the OTP sent for password reset. On success, a short-lived reset token
        (5-minute validity, single-use) is issued as an HttpOnly, Secure cookie for use
        with PATCH /auth/reset-password. The token is not returned in the response body.
        To prevent account enumeration, an unknown email and an invalid or expired OTP
        return the same generic error. Rate limited to 5 requests per minute.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerificationRequest"
      responses:
        "200":
          description: OTP verified, reset token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                    example: OTP verified. You may now reset your password.
        "400":
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  correlationId:
                    type: string
                    example: "1781953113407"
                  message:
                    type: string
                    example: Invalid or expired OTP.
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/reset-password":
    patch:
      operationId: resetPassword
      summary: Reset password
      description: >
        Reset the user's password using the short-lived reset token issued by
        POST /auth/verify-reset-otp. The reset token is read from an HttpOnly, Secure
        cookie, not from the request body or URL. Rate limited to 5 requests per minute.
      tags: [Auth]
      security:
        - resetTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: newPassword1234
              required: [password]
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                    example: Password reset successful.
                  links:
                    type: object
                    properties:
                      sign-in:
                        type: string
                        format: uri
                        example: "/auth/sign-in"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/sign-in":
    post:
      operationId: signIn
      summary: Sign in
      description: >
        Authenticate a user and return an access token; also sets a refreshToken HttpOnly
        cookie and creates a new session for this device. Rate limited to 5 requests per minute.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: example@gmail.com
                password:
                  type: string
                  format: password
                  example: password1234
              required: [email, password]
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                    example: Login successful.
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: "/auth/sign-in"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/refresh":
    post:
      operationId: refreshToken
      summary: Refresh access token
      description: >
        Refresh the access token using the refreshToken cookie.
        The refresh token is expected to be stored in an HttpOnly cookie.
      tags: [Auth]
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                    example: Token refreshed successfully.
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/logout":
    post:
      operationId: logout
      summary: Logout
      description: >
        Logout the current device and invalidate its session only. Other active sessions
        on other devices remain unaffected. Requires both a valid access token and the
        refreshToken cookie together (not either/or), since the session being invalidated
        is identified from the refresh token itself.
      tags: [Auth]
      security:
        - bearerAuth: []
          refreshCookie: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                    example: Logged out successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/logout-all":
    post:
      operationId: logoutAll
      summary: Logout from all devices
      description: Invalidate all active sessions for the authenticated user across every device.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out from all devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                    example: Logged out from all devices successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/sessions":
    get:
      operationId: listSessions
      summary: List active sessions
      description: Retrieve the authenticated user's currently active login sessions/devices.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Return a list of active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                    example: Data retrieved.
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  "/auth/sessions/{sessionId}":
    delete:
      operationId: deleteSession
      summary: Logout specific device
      description: >
        Invalidate a single named session/device while leaving other sessions active.
        The session must belong to the requesting user.
      tags: [Auth]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            example: 665f1a2b3c4d5e6f70910203
      responses:
        "204":
          description: Session logged out successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  # ==================================================
  # Article Routes
  # ==================================================
  "/articles":
    get:
      operationId: listArticles
      summary: List published articles
      description: Retrieve published articles visible to the public.
      tags: [Article]
      parameters:
        - $ref: "#/components/parameters/pageParam"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/sortTypeParam"
        - $ref: "#/components/parameters/sortByParam"
        - $ref: "#/components/parameters/searchParam"
        - $ref: "#/components/parameters/categoryParam"
      responses:
        "200":
          description: Return a list of articles
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                    example: Data retrieved.
                  data:
                    type: array
                    items:
                      allOf:
                        - type: object
                          properties:
                            id:
                              type: string
                              example: 507f1f77bcf86cd799439011
                            title:
                              type: string
                              example: First article
                            cover:
                              type: string
                              format: uri
                              example: "https://s.aws.com/myfirstblog/123.jpg"
                            author:
                              $ref: "#/components/schemas/AuthorDetails"
                            category:
                              $ref: "#/components/schemas/CategoryDetails"
                            link:
                              type: string
                              format: uri
                              example: "/articles/507f1f77bcf86cd799439011"
                          required: [id, title, author, category, link]
                        - $ref: "#/components/schemas/Timestamp"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: "/articles?page=2&limit=2&sortType=desc&sortBy=createdAt&search=&category="
                      next:
                        type: string
                        format: uri
                        example: "/articles?page=3&limit=2&sortType=desc&sortBy=createdAt&search=&category="
                      prev:
                        type: string
                        format: uri
                        example: "/articles?page=1&limit=2&sortType=desc&sortBy=createdAt&search=&category="
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      operationId: createArticle
      summary: Create article
      description: >
        Create an article. The referenced category must exist and be active.
        New articles are published by default; an administrator may change the
        status at any time via PATCH /articles/{id}/status. Requires authentication.
      tags: [Article]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateArticleRequest"
      responses:
        "201":
          $ref: "#/components/responses/ArticleCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  "/articles/admin/all":
    get:
      operationId: listAllArticles
      summary: List all articles
      description: >
        Retrieve all articles, including draft and published articles. Only
        administrators can perform this action.
      tags: [Article]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/pageParam"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/sortTypeParam"
        - $ref: "#/components/parameters/sortByParam"
        - $ref: "#/components/parameters/searchParam"
        - $ref: "#/components/parameters/categoryParam"
        - $ref: "#/components/parameters/articleStatusParam"
      responses:
        "200":
          description: Return a list of all articles
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                    example: Data retrieved.
                  data:
                    type: array
                    items:
                      allOf:
                        - type: object
                          properties:
                            id:
                              type: string
                              example: 507f1f77bcf86cd799439011
                            title:
                              type: string
                              example: First article
                            cover:
                              type: string
                              format: uri
                              example: "https://s.aws.com/myfirstblog/123.jpg"
                            status:
                              type: string
                              enum: [draft, published]
                              example: draft
                            author:
                              $ref: "#/components/schemas/AuthorDetails"
                            category:
                              $ref: "#/components/schemas/CategoryDetails"
                            link:
                              type: string
                              format: uri
                              example: "/articles/507f1f77bcf86cd799439011"
                          required: [id, title, status, author, category, link]
                        - $ref: "#/components/schemas/Timestamp"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: "/articles/admin/all?page=2&limit=2&sortType=asc&sortBy=updatedAt&search=&status=&category="
                      next:
                        type: string
                        format: uri
                        example: "/articles/admin/all?page=3&limit=2&sortType=asc&sortBy=updatedAt&search=&status=&category="
                      prev:
                        type: string
                        format: uri
                        example: "/articles/admin/all?page=1&limit=2&sortType=asc&sortBy=updatedAt&search=&status=&category="
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  "/articles/{id}":
    get:
      operationId: getArticle
      summary: Get article
      description: >
        Published articles are visible to anyone. A draft article is only visible
        to its author or an administrator; for all other callers it responds as
        if the article does not exist.
      tags: [Article]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idPathParam"
        - in: query
          name: expand
          description: >
            Related resources to include in the response. Comments 
            are included only when explicitly requested here.
          required: false
          schema:
            type: array
            items:
              type: string
              enum: [comments]
          style: form
          explode: false
          example: "comments"
      responses:
        "200":
          description: Retrieved an article
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                    example: Data retrieved.
                  data:
                    allOf:
                      - type: object
                        properties:
                          id:
                            type: string
                            example: 507f1f77bcf86cd799439011
                          title:
                            type: string
                            example: first article
                          body:
                            type: string
                            example: first article body
                          cover:
                            type: string
                            format: uri
                            example: https://s.aws.com/myfirstblog/123.jpg
                        required: [id, title, body]
                      - $ref: "#/components/schemas/Timestamp"
                      - type: object
                        properties:
                          author:
                            $ref: "#/components/schemas/AuthorDetails"
                          category:
                            $ref: "#/components/schemas/CategoryDetails"
                          comments:
                            type: array
                            items:
                              allOf:
                                - type: object
                                  properties:
                                    id:
                                      type: string
                                      example: 507f1f77bcf86cd799439011
                                    body:
                                      type: string
                                      example: this is a comment
                                    author:
                                      $ref: "#/components/schemas/AuthorDetails"
                                - $ref: "#/components/schemas/Timestamp"
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: "/articles/507f1f77bcf86cd799439011"
                      author:
                        type: string
                        format: uri
                        example: "/articles/507f1f77bcf86cd799439011/author"
                      comments:
                        type: string
                        format: uri
                        example: "/articles/507f1f77bcf86cd799439011/comments"
        "400":
