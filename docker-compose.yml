services:
  server:
    image: mdismilehosensiam/blog_management_system:latest
    container_name: blog-management-server
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    environment:
      PORT: 4000
      APP_URL: http://localhost:4000
      DB_URL: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/Blog_Management_System?replicaSet=rs0
      ELASTIC_URL: http://elasticsearch:9200
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      mongo1:
        condition: service_started
      mongo2:
        condition: service_started
      mongo3:
        condition: service_started
      elasticsearch:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
    command: yarn dev

  mongo1:
    image: mongo:7
    container_name: blog-management-mongo1
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db

  mongo2:
    image: mongo:7
    container_name: blog-management-mongo2
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db

  mongo3:
    image: mongo:7
    container_name: blog-management-mongo3
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db

  mongo-init:
    image: mongo:7
    container_name: blog-management-mongo-init
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    volumes:
      - ./mongo-init:/scripts
    entrypoint:
      [
        "bash",
        "-c",
        "sleep 10 && mongosh --host mongo1 /scripts/init-replica.js",
      ]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: blog-management-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: blog-management-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  redis:
    image: redis:7-alpine
    container_name: blog-management-redis
    env_file:
      - ./server/.env
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  es_data:
  redis_data:
